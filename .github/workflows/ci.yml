name: CI (tests only)

on:
  push:
    branches: ['**']
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2

    steps:
      # ---- Checkout: ללא סאבמודולים וללא clean כדי לא לגעת ב-submodule "יתום"
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
          clean: false

      # ---- Guard: מחיקה רכה של מטא-דאטה ישנה של הסאבמודול אם קיימת
      - name: Scrub orphan submodule metadata (lemon-src)
        run: |
          set -eo pipefail
          test -d .git/modules/_deps/lemon-src && rm -rf .git/modules/_deps/lemon-src || true
          if test -f .gitmodules && grep -q '_deps/lemon-src' .gitmodules; then
            git config -f .gitmodules --remove-section submodule._deps/lemon-src || true
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install ccache
        run: |
          set -eo pipefail
          which ccache || { sudo apt-get update && sudo apt-get install -y ccache; }
          ccache --version || true

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake', '**/*.hpp', '**/*.h', '**/*.cpp') }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Ensure user pip only (no cmake)
        run: |
          set -eo pipefail
          python3 -m pip uninstall -y cmake || true
          python3 -m pip install --user --upgrade pip
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Show toolchain
        run: |
          set -eo pipefail
          which cmake || true; cmake --version || true
          which ninja || true; ninja --version || true
          which gcc || true; gcc --version || true
          which clang || true; clang --version || true
          which ccache || true; ccache --version || true

      - name: Configure (Linux)
        env:
          CC: gcc
          CXX: g++
        run: |
          set -eo pipefail
          mkdir -p build
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DDOWNLOAD_EXTRACT_TIMESTAMP=TRUE \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DENABLE_ITT=OFF
            2>&1 | tee build/configure.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Build
        run: |
          set -eo pipefail
          cmake --build build --config Release -- -v -k 0 2>&1 | tee build/build.log
          test ${PIPESTATUS[0]} -eq 0

      - name: List tests (no run)
        run: |
          set -eo pipefail
          ctest --test-dir build -N 2>&1 | tee build/ctest-discover.log
          tests=$(ctest --test-dir build -N | awk '/Total Tests:/ {print $3}')
          if [ -z "$tests" ] || [ "$tests" -eq 0 ]; then
            echo "No tests discovered. Failing the build."
            exit 1
          fi

      - name: Test (ctest)
        run: |
          set -eo pipefail
          ctest --test-dir build -C Release --output-on-failure --no-tests=error -j "$(nproc)" 2>&1 | tee build/ctest.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-linux-self-hosted
          path: |
            build/Testing/**/*.xml
            build/CMakeFiles/CMakeOutput.log
            build/CMakeFiles/CMakeError.log
            build/configure.log
            build/build.log
            build/ctest-discover.log
            build/ctest.log
            build/compile_commands.json
          if-no-files-found: ignore
